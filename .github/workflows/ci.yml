name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the build, test and lint jobs on a pull request that touches only
  # prose nothing else reads. README.md and docs/reference.md feed the readme
  # fact tests and the generator, CHANGES.md must carry the VERSION heading,
  # and every file under plugins/ ships, so those always count as code. The
  # two Markdown jobs below run on every change.
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # list the PR's changed files
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          printf '%s\n' "$files"
          code=false
          [ -n "$files" ] || code=true
          while IFS= read -r f; do
            case "$f" in
              README.md | CHANGES.md | docs/reference.md | plugins/*) code=true ;;
              *.md | LICENSE* | assets/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  generated:
    name: Generated files and tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The generator stamps VERSION into the manifests, validates the plugin
      # layout, frontmatter flags and Codex marketplace pointer. A dirty tree
      # afterwards means a committed copy is stale (e.g. VERSION bumped
      # without regenerating).
      - name: Regenerate
        run: bun tools/generate.mjs
      - name: Assert generated files unchanged
        run: git diff --exit-code
      - name: Tool and invariant fixture tests
        run: bun test tests/

  skills-only:
    name: Skills-only install
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs this checkout rather than the GitHub URL, so the canary proves
      # the tree in the PR instead of whatever is on main. One agent target is
      # enough: the CLI copies the same bytes for every agent, and the
      # generated job already validated the source tree's links and prose.
      - name: Install the skills tree with the skills CLI
        run: |
          npx --yes skills@1.5.23 add "$PWD/plugins/pstack/skills" \
            --skill '*' --agent codex --yes --copy
      - name: Compare the installed skills tree with the source
        run: diff -qr plugins/pstack/skills .agents/skills

  scripts:
    name: Vendored bun tooling (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify first-run dependency bootstrap
        run: bun orch/orch.ts --help
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test orch watch-pr

  shellcheck:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name '*.sh' -print |
            sed 's#^\./##' | sort | tee /dev/stderr | xargs shellcheck --severity=warning

  actionlint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job and the two below reach for their tool through docker or npx
      # because allowed_actions permits only GitHub-owned actions, verified
      # creators, oven-sh/setup-bun and zizmorcore/zizmor-action.
      #
      # The 1.7.12 tag is mutable, so the digest is what actually pins this.
      # Resolved with: docker buildx imagetools inspect rhysd/actionlint:1.7.12
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rule selection and the reasoning behind it live in
      # .markdownlint-cli2.jsonc, which the tool picks up from the repo root.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --offline resolves relative file and fragment targets and skips every
      # remote URL, so a contributor's PR never fails on someone else's link
      # rot. tools/validate-skills.mjs already covers the skills tree; this
      # reaches the README, CHANGES, CONTRIBUTING and the other top-level docs.
      #
      # Resolved with: docker buildx imagetools inspect lycheeverse/lychee:0.24.2
      - name: Check relative links and fragments
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path node_modules --exclude-path .git '**/*.md'
